name: Release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore owner signing key when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.GLASSBEAT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glassbeat.jks"
            echo "GLASSBEAT_KEYSTORE=$RUNNER_TEMP/glassbeat.jks" >> "$GITHUB_ENV"
          fi
      - name: Build optimized release
        env:
          GLASSBEAT_STORE_PASSWORD: ${{ secrets.GLASSBEAT_STORE_PASSWORD }}
          GLASSBEAT_KEY_ALIAS: ${{ secrets.GLASSBEAT_KEY_ALIAS }}
          GLASSBEAT_KEY_PASSWORD: ${{ secrets.GLASSBEAT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease lintRelease --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: GlassBeat-release-build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
