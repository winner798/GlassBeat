name: Android CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GlassBeat-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
  device-tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_5
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --max-workers=2
            mkdir -p app/build/outputs/screenshots
            adb pull /sdcard/Android/data/io.github.glassbeat/files/screenshots app/build/outputs/screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/connected_android_test_additional_output/
            app/build/outputs/screenshots/
