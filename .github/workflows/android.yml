name: Android CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GlassBeat-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/
  device-tests:
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: GlassBeat-build
          path: ci-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_5
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 180
          disk-size: 2048M
          ram-size: 2048M
          script: |
            adb install -r ci-artifacts/outputs/apk/debug/app-debug.apk
            adb install -r ci-artifacts/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p app/build/outputs/device-tests
            timeout 300s adb shell am instrument -w -r io.github.glassbeat.test/androidx.test.runner.AndroidJUnitRunner > app/build/outputs/device-tests/instrumentation.txt || true
            cat app/build/outputs/device-tests/instrumentation.txt
            adb logcat -d -s AndroidRuntime TestRunner > app/build/outputs/device-tests/logcat.txt
            mkdir -p app/build/outputs/screenshots
            adb pull /sdcard/Android/data/io.github.glassbeat/files/screenshots app/build/outputs/screenshots/ || true
            python3 -c "import re; s=open('app/build/outputs/device-tests/instrumentation.txt').read(); m=re.search(r'OK \((\d+) tests?\)',s); assert m and int(m[1]) >= 19, 'Device tests did not pass'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results-${{ matrix.api }}
          path: |
            app/build/outputs/device-tests/
            app/build/reports/androidTests/
            app/build/outputs/connected_android_test_additional_output/
            app/build/outputs/screenshots/
